      <div class="nav">
        <!-- ハンバーガーメニューの表示・非表示を切り替えるチェックボックス -->
        <input id="drawer_input" class="drawer_hidden" type="checkbox" />

        <!-- ハンバーガーアイコン -->
        <label for="drawer_input" class="drawer_open"><span></span></label>

        <nav class="nav_content">

    <div id="content">データを読み込んでいます...</div>

    <!-- モーダルウィンドウ -->
    <div id="resultModal" class="modal" style="display: none">
      <div class="modal-content">
        <span id="closeModal" class="close-button">&times;</span>
        <p id="resultMessage"></p>
        <button id="nextQuestionButton" class="option-button">次の質問</button>
      </div>
    </div>

    <!-- 間違えた問題一覧のボタン -->
    <button id="showIncorrect" onclick="showIncorrectQuestions()">
      記録を表示
    </button>

    <!------------------------------------------------------------------------------>
    <!-- 間違えた問題一覧ページ -->
    <div id="incorrectQuestionsPage" style="display: none">
      <h2>記録一覧</h2>
      <ul id="incorrectQuestionsList"></ul>
      <button onclick="goBack()">戻る</button>
      <button onclick="IncorrectAllQuestions()">間違えた問題で出題</button>
      <button onclick="clearLocalStorage()">記録を削除</button>
    </div>

    <!-- loadNextQuestionを起動 -->
    <script src="../script.js" defer></script>
